{% extends "base.html" %}
{% block title %}Accedi{% endblock %}
{% block auth %}
<form method="post" class="modulo scheda">
  <h1>Accedi</h1>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Email <input type="email" name="email" required autofocus autocomplete="username"></label>
  <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
  <button class="btn primario">Accedi</button>
  <p>Nuovo studio? <a href="{{ url_for('auth.registrati') }}">Crea un account</a></p>
</form>
{% endblock %}
