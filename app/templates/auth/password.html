{% extends "base.html" %}
{% block title %}Cambia password{% endblock %}
{% block content %}
<h1>Cambia password</h1>
<form method="post" class="modulo">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Password attuale <input type="password" name="attuale" required autocomplete="current-password"></label>
  <label>Nuova password (almeno 10 caratteri) <input type="password" name="nuova" minlength="10" required autocomplete="new-password"></label>
  <div class="bottoni"><button class="btn primario">Salva</button></div>
</form>
{% endblock %}
