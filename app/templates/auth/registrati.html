{% extends "base.html" %}
{% block title %}Crea account{% endblock %}
{% block auth %}
<form method="post" class="modulo scheda">
  <h1>Crea il tuo studio</h1>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Nome dello studio <input name="studio" required value="{{ request.form.studio }}"></label>
  <label>Il tuo nome <input name="nome" required value="{{ request.form.nome }}" autocomplete="name"></label>
  <label>Email <input type="email" name="email" required value="{{ request.form.email }}" autocomplete="username"></label>
  <label>Password (almeno 10 caratteri) <input type="password" name="password" minlength="10" required autocomplete="new-password"></label>
  <button class="btn primario">Crea account</button>
  <p>Hai già un account? <a href="{{ url_for('auth.login') }}">Accedi</a></p>
</form>
{% endblock %}
